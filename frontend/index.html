<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-powered adaptive technical interview coaching platform with real-time feedback" />
    <title>Interview Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0E0E16;
        --surface: #16161F;
        --surface-raised: #1E1E2E;
        --border: #2A2A3D;
        --accent: #7C5CFC;
        --accent-hover: #9070FF;
        --accent-dim: #3D2F8A;
        --green: #00D68F;
        --amber: #F59E0B;
        --red: #EF4444;
        --text-primary: #F0F0FF;
        --text-secondary: #8888AA;
        --text-muted: #555577;
        --radius: 16px;
        --radius-sm: 10px;
        --radius-xs: 6px;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 15px;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1, h2, h3, h4, h5, h6 { letter-spacing: -0.01em; }

      a { color: var(--accent); text-decoration: none; }
      a:hover { color: var(--accent-hover); }

      /* Animations */
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

      .fade-in { animation: fadeIn 0.3s ease; }
      .slide-up { animation: slideUp 0.4s ease; }
      .scale-in { animation: scaleIn 0.25s ease; }

      .stagger-1 { animation-delay: 0.05s; }
      .stagger-2 { animation-delay: 0.1s; }
      .stagger-3 { animation-delay: 0.15s; }
      .stagger-4 { animation-delay: 0.2s; }
      .stagger-5 { animation-delay: 0.25s; }
      .stagger-6 { animation-delay: 0.3s; }
      .stagger-7 { animation-delay: 0.35s; }
      .stagger-8 { animation-delay: 0.4s; }

      /* Focus */
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

      /* Inputs */
      input, select, textarea {
        font-family: 'Inter', sans-serif;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--accent) !important;
        box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
      }

      /* Selection */
      ::selection { background: rgba(124,92,252,0.3); }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }

      /* Mobile */
      @media (max-width: 768px) {
        .hide-mobile { display: none !important; }
        .stack-mobile { flex-direction: column !important; }
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

      /* Dashboard hover states */
      .nav-link-hover:hover { background: var(--surface-raised); color: var(--text-primary) !important; }
      .nav-btn-hover:hover { background: var(--surface-raised); color: var(--text-primary) !important; }
      .stat-card-hover:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(124,92,252,0.1); }
      .session-row-hover:hover { background: var(--surface-raised); }
      .session-row-hover:hover .delete-btn-reveal { opacity: 0.5 !important; }
      .delete-btn-reveal:hover { color: var(--red) !important; background: rgba(239,68,68,0.1) !important; opacity: 1 !important; }
      .rec-card-hover:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(124,92,252,0.08); }
      .rec-btn-hover:hover { background: var(--accent) !important; color: #fff !important; }
      .btn-primary-hover:hover { background: var(--accent-hover) !important; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,92,252,0.3); }
      .btn-primary-hover:active { transform: translateY(0); }
      .input-hover:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(124,92,252,0.15); }
      .modal-cancel-hover:hover { background: var(--surface) !important; border-color: var(--text-muted) !important; }
      .modal-delete-hover:hover { background: #dc2626 !important; }
      .error-close-hover:hover { background: rgba(239,68,68,0.15); border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

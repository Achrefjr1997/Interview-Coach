# fly.toml app configuration file generated for interview-coach-ulwygg on 2026-05-02T21:46:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'interview-coach-ulwygg'
primary_region = 'fra'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  COACH_CHECKPOINTER_DB = '/data/checkpoints.db'
  COACH_DATABASE_URL = 'sqlite+aiosqlite:///data/coach.db'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
